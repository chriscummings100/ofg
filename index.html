<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OFG</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/app/styles.css" />
  </head>
  <body>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <canvas id="terrain-debug-overlay" hidden></canvas>
    <div id="hud" aria-live="polite">
      <span id="camera-mode">FIRST</span>
      <button id="character-toggle" type="button" aria-label="Toggle player character">
        Male
      </button>
      <span id="frame-time">0.0 ms</span>
    </div>
    <div id="touch-controls" aria-hidden="false">
      <div id="touch-move-zone">
        <div id="touch-move-base">
          <div id="touch-move-thumb"></div>
        </div>
      </div>
      <div id="touch-look-zone">
        <div id="touch-look-base">
          <div id="touch-look-thumb"></div>
        </div>
      </div>
      <button id="touch-camera-toggle" type="button" aria-label="Toggle camera mode"></button>
    </div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
