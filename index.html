<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OFG</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/app/styles.css" />
  </head>
  <body>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <canvas id="terrain-debug-overlay" hidden></canvas>
    <div id="hud" aria-live="polite">
      <span id="camera-mode">FIRST</span>
      <button id="character-toggle" type="button" aria-label="Toggle player character">
        Male
      </button>
      <span id="player-coordinates" title="Player position">X 0.0 Y 0.0 Z 0.0</span>
      <span id="frame-time">0.0 ms</span>
      <button
        id="render-debug-panel-toggle"
        type="button"
        aria-label="Toggle render debug controls"
        aria-expanded="false"
      >
        DBG
      </button>
      <button
        id="perf-overlay-toggle"
        type="button"
        aria-label="Toggle live performance metrics"
        aria-pressed="false"
      >
        PERF
      </button>
      <button
        id="terrain-variant-panel-toggle"
        type="button"
        aria-label="Toggle terrain variant editor"
        aria-expanded="false"
        title="Open terrain variant editor (F10)"
      >
        TER
      </button>
    </div>
    <section id="terrain-variant-panel" aria-label="Terrain variant editor" hidden>
      <div class="terrain-variant-row">
        <label for="terrain-variant-draft" title="Catalog preset or working draft.">Draft</label>
        <select id="terrain-variant-draft" title="Catalog preset or working draft."></select>
      </div>
      <div class="terrain-variant-row">
        <label for="terrain-variant-name" title="Local draft name for export.">Name</label>
        <input id="terrain-variant-name" type="text" title="Local draft name for export." />
      </div>
      <div class="terrain-variant-actions">
        <button id="terrain-variant-duplicate" type="button" title="Copy the selected draft.">Duplicate</button>
        <button id="terrain-variant-reset" type="button" title="Restore this draft from the catalog preset.">Reset</button>
        <button id="terrain-variant-apply" type="button" title="Regenerate terrain without resetting the camera.">Apply</button>
        <button id="terrain-variant-preview-origin" type="button" title="Put this draft at world origin in front of the debug camera.">Origin</button>
      </div>
      <div id="terrain-variant-fields" class="terrain-variant-number-grid"></div>
      <div class="terrain-variant-actions">
        <button id="terrain-variant-export" type="button" title="Write drafts to JSON.">Export</button>
        <button id="terrain-variant-import" type="button" title="Load drafts from JSON.">Import</button>
      </div>
      <textarea id="terrain-variant-json" spellcheck="false" title="Draft import/export JSON."></textarea>
      <div id="terrain-variant-status" aria-live="polite" title="Terrain stream status.">rev 0 | pending | 0/0</div>
    </section>
    <section id="render-debug-panel" aria-label="Render debug controls" hidden>
      <div class="render-debug-row">
        <label for="render-debug-terrain-lod">Terrain LOD</label>
        <select id="render-debug-terrain-lod">
          <option value="all">All</option>
          <option value="lod0">LOD0</option>
          <option value="lod1">LOD1</option>
          <option value="lod2">LOD2</option>
          <option value="lod3plus">LOD3+</option>
          <option value="custom" disabled>Custom</option>
        </select>
      </div>
      <div class="render-debug-grid">
        <label><input id="render-debug-sky" type="checkbox" /> Sky</label>
        <label><input id="render-debug-sky-cloud-noise" type="checkbox" /> Cloud noise</label>
        <label><input id="render-debug-shadow-pass" type="checkbox" /> Shadow pass</label>
        <label><input id="render-debug-shadow-sampling" type="checkbox" /> Shadow sample</label>
        <label><input id="render-debug-white-textures" type="checkbox" /> White tex</label>
      </div>
      <fieldset id="render-debug-cascades">
        <legend>Cascades</legend>
        <label><input type="checkbox" data-shadow-cascade="0" /> 0</label>
        <label><input type="checkbox" data-shadow-cascade="1" /> 1</label>
        <label><input type="checkbox" data-shadow-cascade="2" /> 2</label>
        <label><input type="checkbox" data-shadow-cascade="3" /> 3</label>
      </fieldset>
      <div class="render-debug-row">
        <label for="render-debug-sun">Sun</label>
        <select id="render-debug-sun">
          <option value="production">Production</option>
          <option value="overhead">Overhead</option>
          <option value="angled">Angled</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="render-debug-row">
        <label for="render-debug-material">Material</label>
        <select id="render-debug-material">
          <option value="full">Full</option>
          <option value="lambert">Lambert</option>
        </select>
      </div>
      <fieldset class="debug-panel-fieldset" id="post-debug-effects">
        <legend>Post</legend>
        <div class="render-debug-row">
          <label for="post-debug-view">View</label>
          <select id="post-debug-view">
            <option value="final">Final</option>
            <option value="sceneColor">Scene</option>
            <option value="linearDepth">Depth</option>
            <option value="postToneMap">Tone map</option>
            <option value="bloom">Bloom</option>
            <option value="dofCoc">DoF CoC</option>
            <option value="dofBlurred">DoF blur</option>
            <option value="fogFactor">Fog</option>
          </select>
        </div>
        <div class="render-debug-grid">
          <label><input id="post-tone-mapping" type="checkbox" /> Tone map</label>
          <label><input id="post-bloom" type="checkbox" /> Bloom</label>
          <label><input id="post-dof" type="checkbox" /> DoF</label>
          <label><input id="post-fog" type="checkbox" /> Fog</label>
        </div>
        <div class="render-debug-number-grid">
          <label for="post-exposure">Exposure</label>
          <input id="post-exposure" type="number" min="0" max="16" step="0.05" />
          <label for="post-bloom-threshold">Bloom th</label>
          <input id="post-bloom-threshold" type="number" min="0" max="64" step="0.05" />
          <label for="post-bloom-intensity">Bloom int</label>
          <input id="post-bloom-intensity" type="number" min="0" max="4" step="0.01" />
          <label for="post-dof-focus">Focus</label>
          <input id="post-dof-focus" type="number" min="0.1" max="512" step="0.1" />
          <label for="post-dof-range">Range</label>
          <input id="post-dof-range" type="number" min="0.1" max="256" step="0.1" />
          <label for="post-dof-blur">Blur px</label>
          <input id="post-dof-blur" type="number" min="0" max="32" step="0.5" />
        </div>
        <div class="render-debug-range-grid">
          <label for="post-fog-start-range">Fog start</label>
          <input id="post-fog-start-range" type="range" min="0" max="4000" step="50" />
          <input id="post-fog-start" type="number" min="0" max="50000" step="50" />
          <label for="post-fog-end-range">Fog end</label>
          <input id="post-fog-end-range" type="range" min="50" max="4000" step="50" />
          <input id="post-fog-end" type="number" min="0.1" max="50000" step="50" />
          <label for="post-fog-density-range">Fog dens</label>
          <input id="post-fog-density-range" type="range" min="0" max="1" step="0.01" />
          <input id="post-fog-density" type="number" min="0" max="1" step="0.01" />
          <label for="post-fog-curve-range">Fog curve</label>
          <input id="post-fog-curve-range" type="range" min="0.1" max="8" step="0.05" />
          <input id="post-fog-curve" type="number" min="0.1" max="8" step="0.05" />
        </div>
        <div class="render-debug-number-grid">
          <label for="post-fog-r">Tint R</label>
          <input id="post-fog-r" type="number" min="0" max="16" step="0.01" />
          <label for="post-fog-g">Tint G</label>
          <input id="post-fog-g" type="number" min="0" max="16" step="0.01" />
          <label for="post-fog-b">Tint B</label>
          <input id="post-fog-b" type="number" min="0" max="16" step="0.01" />
        </div>
        <button id="post-debug-reset" type="button">Reset post</button>
      </fieldset>
      <fieldset class="debug-panel-fieldset" id="water-debug-effects">
        <legend>Water</legend>
        <div class="render-debug-row">
          <label for="water-debug-view">View</label>
          <select id="water-debug-view">
            <option value="final">Final</option>
            <option value="bottomDepth">Bottom depth</option>
            <option value="pathLength">Path length</option>
            <option value="fresnel">Fresnel</option>
            <option value="reflection">Reflection</option>
          </select>
        </div>
        <div class="render-debug-grid">
          <label><input id="water-enabled" type="checkbox" /> Water</label>
          <label><input id="water-reflection" type="checkbox" /> Reflection</label>
        </div>
        <div id="water-debug-status" aria-live="polite">water</div>
      </fieldset>
      <div class="render-debug-actions">
        <button id="render-debug-reset" type="button">Reset</button>
        <button id="perf-debug-reset" type="button">Reset perf</button>
      </div>
    </section>
    <pre id="perf-overlay" aria-label="Live performance metrics" hidden></pre>
    <div id="touch-controls" aria-hidden="false">
      <div id="touch-move-zone">
        <div id="touch-move-base">
          <div id="touch-move-thumb"></div>
        </div>
      </div>
      <div id="touch-look-zone">
        <div id="touch-look-base">
          <div id="touch-look-thumb"></div>
        </div>
      </div>
      <button id="touch-camera-toggle" type="button" aria-label="Toggle camera mode"></button>
    </div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
