<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OFG</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/app/styles.css" />
  </head>
  <body>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <canvas id="terrain-debug-overlay" hidden></canvas>
    <div id="hud" aria-live="polite">
      <span id="camera-mode">FIRST</span>
      <button id="character-toggle" type="button" aria-label="Toggle player character">
        Male
      </button>
      <span id="frame-time">0.0 ms</span>
      <button
        id="render-debug-panel-toggle"
        type="button"
        aria-label="Toggle render debug controls"
        aria-expanded="false"
      >
        DBG
      </button>
      <button
        id="perf-overlay-toggle"
        type="button"
        aria-label="Toggle live performance metrics"
        aria-pressed="false"
      >
        PERF
      </button>
    </div>
    <section id="render-debug-panel" aria-label="Render debug controls" hidden>
      <div class="render-debug-row">
        <label for="render-debug-terrain-lod">Terrain LOD</label>
        <select id="render-debug-terrain-lod">
          <option value="all">All</option>
          <option value="lod0">LOD0</option>
          <option value="lod1">LOD1</option>
          <option value="lod2">LOD2</option>
          <option value="lod3plus">LOD3+</option>
          <option value="custom" disabled>Custom</option>
        </select>
      </div>
      <div class="render-debug-grid">
        <label><input id="render-debug-sky" type="checkbox" /> Sky</label>
        <label><input id="render-debug-sky-cloud-noise" type="checkbox" /> Cloud noise</label>
        <label><input id="render-debug-shadow-pass" type="checkbox" /> Shadow pass</label>
        <label><input id="render-debug-shadow-sampling" type="checkbox" /> Shadow sample</label>
        <label><input id="render-debug-white-textures" type="checkbox" /> White tex</label>
      </div>
      <fieldset id="render-debug-cascades">
        <legend>Cascades</legend>
        <label><input type="checkbox" data-shadow-cascade="0" /> 0</label>
        <label><input type="checkbox" data-shadow-cascade="1" /> 1</label>
        <label><input type="checkbox" data-shadow-cascade="2" /> 2</label>
        <label><input type="checkbox" data-shadow-cascade="3" /> 3</label>
      </fieldset>
      <div class="render-debug-row">
        <label for="render-debug-sun">Sun</label>
        <select id="render-debug-sun">
          <option value="production">Production</option>
          <option value="overhead">Overhead</option>
          <option value="angled">Angled</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="render-debug-row">
        <label for="render-debug-material">Material</label>
        <select id="render-debug-material">
          <option value="full">Full</option>
          <option value="lambert">Lambert</option>
        </select>
      </div>
      <fieldset class="debug-panel-fieldset" id="post-debug-effects">
        <legend>Post</legend>
        <div class="render-debug-row">
          <label for="post-debug-view">View</label>
          <select id="post-debug-view">
            <option value="final">Final</option>
            <option value="sceneColor">Scene</option>
            <option value="linearDepth">Depth</option>
            <option value="postToneMap">Tone map</option>
            <option value="bloom">Bloom</option>
            <option value="dofCoc">DoF CoC</option>
            <option value="dofBlurred">DoF blur</option>
          </select>
        </div>
        <div class="render-debug-grid">
          <label><input id="post-tone-mapping" type="checkbox" /> Tone map</label>
          <label><input id="post-bloom" type="checkbox" /> Bloom</label>
          <label><input id="post-dof" type="checkbox" /> DoF</label>
        </div>
        <div class="render-debug-number-grid">
          <label for="post-exposure">Exposure</label>
          <input id="post-exposure" type="number" min="0" max="16" step="0.05" />
          <label for="post-bloom-threshold">Bloom th</label>
          <input id="post-bloom-threshold" type="number" min="0" max="64" step="0.05" />
          <label for="post-bloom-intensity">Bloom int</label>
          <input id="post-bloom-intensity" type="number" min="0" max="4" step="0.01" />
          <label for="post-dof-focus">Focus</label>
          <input id="post-dof-focus" type="number" min="0.1" max="512" step="0.1" />
          <label for="post-dof-range">Range</label>
          <input id="post-dof-range" type="number" min="0.1" max="256" step="0.1" />
          <label for="post-dof-blur">Blur px</label>
          <input id="post-dof-blur" type="number" min="0" max="32" step="0.5" />
        </div>
        <button id="post-debug-reset" type="button">Reset post</button>
      </fieldset>
      <div class="render-debug-actions">
        <button id="render-debug-reset" type="button">Reset</button>
        <button id="perf-debug-reset" type="button">Reset perf</button>
      </div>
    </section>
    <pre id="perf-overlay" aria-label="Live performance metrics" hidden></pre>
    <div id="touch-controls" aria-hidden="false">
      <div id="touch-move-zone">
        <div id="touch-move-base">
          <div id="touch-move-thumb"></div>
        </div>
      </div>
      <div id="touch-look-zone">
        <div id="touch-look-base">
          <div id="touch-look-thumb"></div>
        </div>
      </div>
      <button id="touch-camera-toggle" type="button" aria-label="Toggle camera mode"></button>
    </div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
