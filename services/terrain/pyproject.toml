[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ofg-terrain-service"
version = "0.1.0"
description = "OFG's independent island generator and immutable terrain content server"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "numpy", "pillow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["terrain_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["terrain_service"]
concurrency = ["multiprocessing", "thread"]
parallel = true

