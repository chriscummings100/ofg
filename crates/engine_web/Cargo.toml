[package]
name = "engine_web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
engine_core = { path = "../engine_core" }
indexmap = "=2.7.0"
js-sys = "=0.3.77"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
terrain_core = { path = "../terrain_core" }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
wgpu = "0.20.1"
