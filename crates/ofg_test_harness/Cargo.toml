[package]
name = "ofg_test_harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ofg-render-smoke"
path = "src/bin/ofg-render-smoke.rs"

[[bin]]
name = "ofg-terrain-bench"
path = "src/bin/ofg-terrain-bench.rs"

[dependencies]
engine_core = { path = "../engine_core" }
engine_web = { path = "../engine_web" }
image = { version = "=0.25.6", default-features = false, features = ["png"] }
pollster = "=0.3.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
terrain_core = { path = "../terrain_core", features = ["benchmark"] }
wgpu = "0.20.1"
