[package]
name = "ofg_web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "=0.1.7"
js-sys = "=0.3.102"
ofg_core = { path = "../ofg_core" }
ofg_render = { path = "../ofg_render" }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "=0.4.75"
web-sys = { version = "=0.3.102", features = ["HtmlCanvasElement", "console"] }
wgpu = "=29.0.3"

[dev-dependencies]
wasm-bindgen-test = "=0.3.75"
